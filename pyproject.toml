[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-architect"
version = "0.1.0"
description = "Visual Multi-Agent Architecture Builder - local-first, code-owned"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "import-linter>=2.0", "ruff>=0.4"]
langgraph = ["langgraph>=0.2"]

[project.scripts]
agent-architect = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["core*", "backend*"]

[tool.setuptools.package-data]
"core.generator" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
ignore = ["B008", "B905"]  # B008: FastAPI Depends() in defaults is the idiom

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
